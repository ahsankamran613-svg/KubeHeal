[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kubeheal"
version = "0.1.0"
description = "Guardrailed Kubernetes AIOps Triage Agent with MCP and GitOps Remediation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "KubeHeal Maintainers" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.8.0",
    "mcp>=1.0.0",
    "groq>=0.18.0",
    "httpx>=0.28.0",
    "kubernetes>=31.0.0",
    "PyGithub>=2.10.0",
    "ruamel.yaml>=0.18.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

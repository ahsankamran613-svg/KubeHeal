<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KubeHeal — Guardrailed Kubernetes AIOps Triage</title>
  <style>
    :root {
      --bg: #090d16;
      --surface: #111827;
      --surface-elevated: #1f2937;
      --border: #2d3748;
      --border-subtle: #1e293b;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.15);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --shield: #059669;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation / Status Header */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      color: #fff;
      box-shadow: 0 0 12px var(--primary-glow);
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-subtitle {
      color: var(--text-dim);
      font-size: 12px;
      font-family: var(--font-mono);
    }

    .system-badges {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-family: var(--font-mono);
      font-weight: 500;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .badge.active-shield {
      border-color: rgba(16, 185, 129, 0.4);
      background: rgba(16, 185, 129, 0.1);
      color: #34d399;
    }

    .badge.groq-active {
      border-color: rgba(56, 189, 248, 0.4);
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    /* Action Dock */
    .action-dock {
      background: var(--surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .trigger-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      cursor: pointer;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 6px;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.15s ease;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.4);
      color: #f87171;
    }
    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.25);
    }

    .btn-warning {
      background: rgba(245, 158, 11, 0.15);
      border-color: rgba(245, 158, 11, 0.4);
      color: #fbbf24;
    }
    .btn-warning:hover {
      background: rgba(245, 158, 11, 0.25);
    }

    .btn-secondary {
      background: var(--surface-elevated);
      border-color: var(--border);
      color: var(--text-muted);
    }
    .btn-secondary:hover {
      background: #374151;
      color: var(--text-main);
    }

    .guardrail-test-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      max-width: 460px;
    }

    .guardrail-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 12px;
      outline: none;
    }
    .guardrail-input:focus {
      border-color: var(--primary);
    }

    /* Main Grid Layout */
    .main-layout {
      flex: 1;
      display: grid;
      grid-template-columns: 340px 1fr;
      min-height: 0;
    }

    /* Sidebar: Incidents Stream */
    .incident-sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: calc(100vh - 120px);
    }

    .sidebar-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .incident-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }

    .incident-item {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .incident-item:hover {
      background: var(--surface-elevated);
    }

    .incident-item.selected {
      background: rgba(56, 189, 248, 0.08);
      border-left: 3px solid var(--primary);
    }

    .incident-item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .incident-pod-name {
      font-weight: 600;
      color: var(--text-main);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }

    .incident-reason {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .reason-oom {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }

    .reason-crash {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
    }

    .incident-time {
      font-size: 11px;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }

    /* Detail Pane */
    .incident-detail {
      padding: 24px 32px;
      overflow-y: auto;
      height: calc(100vh - 120px);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-dim);
      text-align: center;
      gap: 12px;
    }

    .empty-state-icon {
      font-size: 40px;
      margin-bottom: 8px;
    }

    /* Detail Components */
    .detail-hero {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      flex-wrap: wrap;
    }

    .detail-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .detail-meta {
      display: flex;
      gap: 12px;
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--text-muted);
    }

    .section-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .section-card-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
    }

    .analysis-text {
      color: #cbd5e1;
      line-height: 1.6;
      white-space: pre-line;
    }

    /* MCP Trace Table */
    .trace-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      font-family: var(--font-mono);
    }

    .trace-table th {
      text-align: left;
      padding: 8px 12px;
      background: var(--surface-elevated);
      color: var(--text-dim);
      font-weight: 600;
      border-bottom: 1px solid var(--border);
    }

    .trace-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-subtle);
      vertical-align: top;
    }

    .trace-blocked {
      color: var(--danger);
      font-weight: 600;
    }

    .trace-success {
      color: var(--success);
      font-weight: 600;
    }

    /* Diff Container */
    .diff-block {
      background: #050811;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px;
      font-family: var(--font-mono);
      font-size: 12px;
      overflow-x: auto;
      line-height: 1.6;
    }

    .diff-line-add {
      color: #4ade80;
      background: rgba(34, 197, 94, 0.08);
      display: block;
    }

    .diff-line-del {
      color: #f87171;
      background: rgba(239, 68, 68, 0.08);
      display: block;
    }

    .diff-line-info {
      color: #38bdf8;
      display: block;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface-elevated);
      border: 1px solid var(--primary);
      color: var(--text-main);
      padding: 12px 20px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 13px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      display: none;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <!-- Top Navigation & System Health -->
  <header>
    <div class="brand">
      <div class="brand-icon">KH</div>
      <div>
        <div class="brand-title">KubeHeal <span class="badge active-shield"><span class="dot"></span>MCP Guardrails Active</span></div>
        <div class="brand-subtitle">Autonomous Read-Only Kubernetes AIOps & GitOps Remediator</div>
      </div>
    </div>
    <div class="system-badges" id="system-badges">
      <div class="badge"><span class="dot"></span>Connecting...</div>
    </div>
  </header>

  <!-- Action Dock -->
  <div class="action-dock">
    <div class="trigger-group">
      <button class="btn-danger" onclick="triggerSimulation('oom-crash')">
        💥 Simulate OOMKilled
      </button>
      <button class="btn-warning" onclick="triggerSimulation('config-crash')">
        ⚠️ Simulate CrashLoopBackOff
      </button>
      <button class="btn-secondary" onclick="fetchIncidents()">
        🔄 Refresh
      </button>
    </div>

    <!-- Guardrail Live Interceptor Test -->
    <div class="guardrail-test-bar">
      <input type="text" id="guardrailCmd" class="guardrail-input" value="kubectl delete pod --all -n default" placeholder="Test forbidden or read-only kubectl query...">
      <button class="btn-secondary" onclick="testGuardrail()">Test Guardrail</button>
    </div>
  </div>

  <!-- Main Work Area -->
  <div class="main-layout">
    <!-- Incident History Sidebar -->
    <div class="incident-sidebar">
      <div class="sidebar-header">
        <span>Incident Stream</span>
        <span id="incident-count">0</span>
      </div>
      <ul class="incident-list" id="incidentList">
        <!-- Rendered via JS -->
      </ul>
    </div>

    <!-- Incident Detail View -->
    <div class="incident-detail" id="incidentDetail">
      <div class="empty-state">
        <div class="empty-state-icon">🛡️</div>
        <h3>No Incident Selected</h3>
        <p>Trigger an <strong>OOMKilled</strong> or <strong>CrashLoopBackOff</strong> simulation above,<br>or test the read-only guardrail interceptor.</p>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    let incidents = [];
    let selectedIncidentId = null;

    function showToast(msg, isError = false) {
      const toast = document.getElementById("toast");
      toast.innerText = msg;
      toast.style.borderColor = isError ? "var(--danger)" : "var(--primary)";
      toast.style.display = "block";
      setTimeout(() => { toast.style.display = "none"; }, 3500);
    }

    async function checkHealth() {
      try {
        const res = await fetch("/api/health");
        const data = await res.json();
        const container = document.getElementById("system-badges");
        container.innerHTML = `
          <div class="badge ${data.cluster_connected ? 'active-shield' : ''}">
            <span class="dot"></span>${data.cluster_connected ? 'k3d Connected' : 'Mock/Offline Cluster'}
          </div>
          <div class="badge groq-active">
            <span class="dot"></span>Groq: ${data.groq_model}
          </div>
          <div class="badge">
            <span class="dot"></span>${data.dry_run_mode ? 'GitOps: Dry-Run Proposals' : 'GitOps: GitHub PR'}
          </div>
          <div class="badge active-shield">
            <span class="dot"></span>RBAC: get,list,watch
          </div>
        `;
      } catch (err) {
        console.error("Health check failed", err);
      }
    }

    async function fetchIncidents() {
      try {
        const res = await fetch("/api/incidents");
        incidents = await res.json();
        renderIncidentList();
        if (incidents.length > 0 && !selectedIncidentId) {
          selectIncident(incidents[0].incident_id);
        } else if (selectedIncidentId) {
          const match = incidents.find(i => i.incident_id === selectedIncidentId);
          if (match) renderIncidentDetail(match);
        }
      } catch (err) {
        console.error("Failed to fetch incidents", err);
      }
    }

    function renderIncidentList() {
      const list = document.getElementById("incidentList");
      const countEl = document.getElementById("incident-count");
      countEl.innerText = incidents.length;

      if (incidents.length === 0) {
        list.innerHTML = `
          <li style="padding: 24px 18px; text-align: center; color: var(--text-dim);">
            No incidents detected yet.<br>Click a simulation above to start.
          </li>
        `;
        return;
      }

      list.innerHTML = incidents.map(inc => {
        const isOOM = (inc.alert.reason || "").includes("OOM");
        const reasonClass = isOOM ? "reason-oom" : "reason-crash";
        const isSelected = inc.incident_id === selectedIncidentId;
        const shortTime = new Date(inc.created_at).toLocaleTimeString();

        return `
          <li class="incident-item ${isSelected ? 'selected' : ''}" onclick="selectIncident('${inc.incident_id}')">
            <div class="incident-item-header">
              <span class="incident-pod-name" title="${inc.alert.pod_name}">${inc.alert.pod_name}</span>
              <span class="incident-reason ${reasonClass}">${inc.alert.reason}</span>
            </div>
            <div style="display:flex; justify-content:space-between;">
              <span class="incident-time">#${inc.incident_id}</span>
              <span class="incident-time">${shortTime}</span>
            </div>
          </li>
        `;
      }).join("");
    }

    function selectIncident(id) {
      selectedIncidentId = id;
      renderIncidentList();
      const inc = incidents.find(i => i.incident_id === id);
      if (inc) renderIncidentDetail(inc);
    }

    function renderIncidentDetail(inc) {
      const container = document.getElementById("incidentDetail");
      const alert = inc.alert;
      const confidencePercent = Math.round((inc.confidence || 0) * 100);

      // Format diff with syntax coloring
      const diffLines = (inc.yaml_diff || "").split("\n").map(line => {
        if (line.startsWith("+") && !line.startsWith("+++")) {
          return `<span class="diff-line-add">${escapeHtml(line)}</span>`;
        } else if (line.startsWith("-") && !line.startsWith("---")) {
          return `<span class="diff-line-del">${escapeHtml(line)}</span>`;
        } else if (line.startsWith("@@")) {
          return `<span class="diff-line-info">${escapeHtml(line)}</span>`;
        }
        return `<span>${escapeHtml(line)}</span>`;
      }).join("\n");

      // Format MCP tool traces
      const traceRows = (inc.mcp_traces || []).map(t => {
        const badgeClass = t.blocked_by_guardrail ? "trace-blocked" : (t.status === "success" ? "trace-success" : "");
        const badgeText = t.blocked_by_guardrail ? "🛡️ BLOCKED" : (t.status === "success" ? "✅ SUCCESS" : "⚠️ " + t.status.toUpperCase());
        return `
          <tr>
            <td style="font-weight:600; color:var(--text-main);">${escapeHtml(t.tool_name)}</td>
            <td style="color:var(--text-muted);">${escapeHtml(JSON.stringify(t.arguments))}</td>
            <td class="${badgeClass}">${badgeText}</td>
            <td style="color:var(--text-dim); max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${escapeHtml(t.output_preview)}">
              ${escapeHtml(t.output_preview)}
            </td>
          </tr>
        `;
      }).join("");

      container.innerHTML = `
        <div class="detail-hero">
          <div>
            <div class="detail-title">Incident ${inc.incident_id} — ${escapeHtml(alert.pod_name)}</div>
            <div class="detail-meta">
              <span>Reason: <strong>${escapeHtml(alert.reason)}</strong></span>
              <span>Exit Code: <strong>${alert.exit_code !== null ? alert.exit_code : 'N/A'}</strong></span>
              <span>Namespace: <strong>${escapeHtml(alert.namespace)}</strong></span>
              <span>AI Confidence: <strong>${confidencePercent}%</strong></span>
              <span>Duration: <strong>${inc.duration_seconds || '0.5'}s</strong></span>
            </div>
          </div>
          <div>
            ${inc.pr_url ? `<a href="${inc.pr_url}" target="_blank" class="badge" style="background:#238636; color:#fff; text-decoration:none; padding:8px 14px; font-weight:600;">View GitHub PR ↗</a>` : ''}
            ${inc.local_proposal_path ? `<span class="badge" title="Bundle saved on disk">📁 ${escapeHtml(inc.local_proposal_path)}</span>` : ''}
          </div>
        </div>

        <!-- AI Root Cause Card -->
        <div class="section-card">
          <div class="section-card-title">🔍 AI Root Cause Diagnosis</div>
          <div class="analysis-text">${escapeHtml(inc.root_cause_summary)}</div>
        </div>

        <!-- MCP Tool Audit Traces Card -->
        <div class="section-card">
          <div class="section-card-title">🔬 MCP Read-Only Inspection Traces (${(inc.mcp_traces || []).length} Operations)</div>
          <table class="trace-table">
            <thead>
              <tr>
                <th>Tool</th>
                <th>Arguments</th>
                <th>Guardrail Status</th>
                <th>Output Preview</th>
              </tr>
            </thead>
            <tbody>
              ${traceRows || '<tr><td colspan="4" style="color:var(--text-dim);">No MCP traces recorded.</td></tr>'}
            </tbody>
          </table>
        </div>

        <!-- GitOps YAML Remediation Diff Card -->
        <div class="section-card">
          <div class="section-card-title">🛠️ GitOps Manifest Remediation Diff (ruamel.yaml)</div>
          <pre class="diff-block">${diffLines || 'No diff generated.'}</pre>
        </div>

        <!-- Defense-in-Depth Verification Card -->
        <div class="section-card">
          <div class="section-card-title">🛡️ Defense-in-Depth Guardrail Verification</div>
          <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap:12px; font-size:12px;">
            <div style="background:var(--surface-elevated); padding:12px; border-radius:6px; border:1px solid var(--border);">
              <strong>1. Code-Level MCP Guardrail</strong><br>
              <span style="color:#34d399;">✓ Enforced</span>: Mutating verbs (delete, apply, patch, exec) and shell injections blocked.
            </div>
            <div style="background:var(--surface-elevated); padding:12px; border-radius:6px; border:1px solid var(--border);">
              <strong>2. Cluster-Level RBAC Guardrail</strong><br>
              <span style="color:#34d399;">✓ Enforced</span>: ServiceAccount <code>kubeheal-reader</code> restricted to <code>["get", "list", "watch"]</code>.
            </div>
            <div style="background:var(--surface-elevated); padding:12px; border-radius:6px; border:1px solid var(--border);">
              <strong>3. GitOps Human-in-the-Loop</strong><br>
              <span style="color:#34d399;">✓ Enforced</span>: Zero live cluster mutation. Remediations proposed as PR or local proposal bundle.
            </div>
          </div>
        </div>
      `;
    }

    async function triggerSimulation(scenario) {
      showToast(`Initiating simulation: ${scenario}...`);
      try {
        const res = await fetch(`/api/simulate/${scenario}`, { method: "POST" });
        if (!res.ok) throw new Error("Simulation request failed");
        const report = await res.json();
        showToast(`Triage completed for incident ${report.incident_id}!`);
        await fetchIncidents();
        selectIncident(report.incident_id);
      } catch (err) {
        showToast(err.message, true);
      }
    }

    async function testGuardrail() {
      const cmd = document.getElementById("guardrailCmd").value;
      if (!cmd) return;
      try {
        const res = await fetch("/api/guardrail-test", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ command: cmd }),
        });
        const data = await res.json();
        if (data.guardrail_verdict === "BLOCKED") {
          alert(`🛡️ GUARDRAIL INTERCEPTED VIOLATION!\n\nCommand: ${data.command}\nStatus: BLOCKED\nReason: ${data.reason}`);
        } else {
          alert(`✅ COMMAND ALLOWED BY READ-ONLY GUARDRAIL\n\nCommand: ${data.command}\nResult:\n${data.execution_result.stdout || data.execution_result.stderr || '(no output)'}`);
        }
      } catch (err) {
        showToast("Guardrail test request failed: " + err.message, true);
      }
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Initialize
    checkHealth();
    fetchIncidents();
    setInterval(fetchIncidents, 10000);
  </script>
</body>
</html>
